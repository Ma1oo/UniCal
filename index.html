<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UniCal プロトタイプ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#F6F7FA; --ink:#1C2230; --ink-2:#5A6375; --ink-3:#8A93A3; --line:#E0E4EB;
  --class:#3B5BD9; --class-tint:#E8EDFC; --on-class:#FFFFFF;
  --task:#CF3F36; --task-tint:#FCEAE8;
  --priv:#2A9264; --priv-tint:#E3F3EB;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151C; --surface:#1B1F29; --surface-2:#232835; --ink:#E8EBF2; --ink-2:#A7AFBF; --ink-3:#7B8495; --line:#2F3544;
    --class:#8099F4; --class-tint:#232C4B; --on-class:#0F1530;
    --task:#F0786E; --task-tint:#3B2325;
    --priv:#5CC495; --priv-tint:#1D3329;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12151C; --surface:#1B1F29; --surface-2:#232835; --ink:#E8EBF2; --ink-2:#A7AFBF; --ink-3:#7B8495; --line:#2F3544;
  --class:#8099F4; --class-tint:#232C4B; --on-class:#0F1530;
  --task:#F0786E; --task-tint:#3B2325;
  --priv:#5CC495; --priv-tint:#1D3329;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--class);outline-offset:2px}
.shell{max-width:460px;margin:0 auto;min-height:100vh;padding-bottom:96px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 16px}
.mark{width:26px;height:26px;border-radius:8px;background:var(--class);color:var(--on-class);display:grid;place-items:center;font-weight:700;font-size:14px}
.logo{font-weight:700;font-size:18px}
.role{font-size:12px;padding:1px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.spacer{flex:1}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--class-tint);color:var(--class);display:grid;place-items:center;font-weight:700;border:0;cursor:pointer;flex:none}
.avatar.big{width:52px;height:52px;font-size:20px}
main{padding:18px 16px}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-inner{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:none;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--ink-3);cursor:pointer;position:relative}
.nav button[aria-current="page"]{color:var(--class);font-weight:700}
.nav svg{width:22px;height:22px}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--task);color:#fff;font-size:10px;line-height:16px;padding:0 4px;font-weight:700}
.block{margin-bottom:24px}
h2{font-size:15px;margin:0 0 8px;font-weight:700;display:flex;align-items:center;gap:8px}
h2 .count{font-weight:500;color:var(--ink-3);font-size:13px}
h2 .spacer{flex:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.item:first-child{border-top:0}
.rail{width:4px;align-self:stretch;border-radius:4px;flex:none}
.rail.class{background:var(--class)}
.rail.task{background:var(--task)}
.rail.priv{background:var(--priv)}
.rail.meet{background:repeating-linear-gradient(var(--class) 0 5px,transparent 5px 8px)}
.time{font-size:12px;color:var(--ink-2);min-width:42px;line-height:1.35;font-variant-numeric:tabular-nums}
.main{flex:1;min-width:0}
.title{font-weight:500;line-height:1.4}
.sub{font-size:12px;color:var(--ink-2);line-height:1.5}
.empty{padding:14px;color:var(--ink-3);font-size:13px}
.note{font-size:12px;color:var(--ink-3);margin:6px 2px 0}
.hero{display:flex;gap:14px;align-items:flex-end;margin:2px 0 22px}
.hero .num{font-size:64px;line-height:.82;font-weight:700;color:var(--class);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hero h1{font-size:20px;margin:2px 0 0;line-height:1.35}
.copy{color:var(--ink-2);font-size:13px;margin:2px 0 0}
.moods{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.moods button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--ink-2)}
.moods .face{font-size:15px;color:var(--ink);white-space:nowrap}
.moods button[aria-pressed="true"]{border-color:var(--priv);background:var(--priv-tint);color:var(--ink);font-weight:700}
.alert{border:1.5px solid var(--task);background:var(--task-tint)}
.alert .item{border-color:color-mix(in srgb,var(--task) 25%,transparent)}
.due{font-size:12px;font-weight:700;color:var(--task);white-space:nowrap}
.due.calm{color:var(--ink-2);font-weight:500}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;cursor:pointer;font-size:14px;white-space:nowrap}
.btn.primary{background:var(--class);border-color:var(--class);color:var(--on-class);font-weight:700}
.btn.danger{color:var(--task)}
.btn.small{padding:4px 10px;font-size:12px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--class)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.x{border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:18px;line-height:1;padding:4px 6px;border-radius:6px}
.att{display:flex;gap:4px;flex:none}
.att button{border:1px solid var(--line);background:var(--surface);font-size:12px;padding:3px 9px;border-radius:999px;cursor:pointer;color:var(--ink-2)}
.att button.on-p{background:var(--class-tint);border-color:var(--class);color:var(--class);font-weight:700}
.att button.on-a{background:var(--task-tint);border-color:var(--task);color:var(--task);font-weight:700}
.att button:disabled{opacity:.4;cursor:not-allowed}
.check{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--ink-3);background:none;display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.check.done{background:var(--priv);border-color:var(--priv);color:#fff}
.check svg{width:14px;height:14px}
.done-text{text-decoration:line-through;color:var(--ink-3)}
.add-row{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.add-row input{flex:1}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
textarea{min-height:80px;resize:vertical}
label.f{display:block;font-size:12px;color:var(--ink-2);margin-bottom:12px}
label.f input,label.f select,label.f textarea{margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 0 0 1px var(--line)}
.cal-head{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.cal-head .ym{font-weight:700;font-size:18px;flex:1;font-variant-numeric:tabular-nums}
.arrow{border:1px solid var(--line);background:var(--surface);width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:16px}
.cal{padding:6px 6px 8px}
.grid7{display:grid;grid-template-columns:repeat(7,1fr)}
.dow{font-size:11px;text-align:center;color:var(--ink-3);padding:4px 0}
.dow.sun{color:var(--task)} .dow.sat{color:var(--class)}
.day{border:0;background:none;display:flex;flex-direction:column;align-items:center;padding:4px 0 6px;gap:3px;cursor:pointer;border-radius:10px;min-height:52px}
.day.out{opacity:.35}
.day .n{font-size:14px;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
.day.sun .n,.day.hol .n{color:var(--task)}
.day.sat .n{color:var(--class)}
.day.today .n{background:var(--class);color:var(--on-class);font-weight:700}
.day.sel{background:var(--surface-2)}
.day.sel .n{box-shadow:0 0 0 2px var(--class)}
.day.today.sel .n{box-shadow:0 0 0 2px var(--surface-2),0 0 0 4px var(--class)}
.dots{display:flex;gap:3px;height:6px}
.dot{width:6px;height:6px;border-radius:50%}
.dot.class{background:var(--class)} .dot.task{background:var(--task)} .dot.priv{background:var(--priv)}
.dot.meet{box-shadow:inset 0 0 0 1.5px var(--class)}
.rail.meet.pend{opacity:.45}
.who-l{font-size:11px;color:var(--ink-3);margin:2px 0 -4px 6px}
.msg.tch{border-color:var(--class);box-shadow:inset 3px 0 0 var(--class)}
.menu-btn .streak{margin-left:auto}
.mstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-top:8px}
.mday{text-align:center;font-size:10px;color:var(--ink-3);background:var(--surface-2);border-radius:6px;padding:3px 0;line-height:1.35}
.mday b{display:block;font-size:10.5px;color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden}
.mday.bad{background:var(--task-tint)}
.mday.bad b{color:var(--task);font-weight:700}
.mday.none b{color:var(--ink-3)}
.mday.today{box-shadow:inset 0 0 0 1.5px var(--class)}
.streak{font-size:12px;font-weight:700;color:var(--task);white-space:nowrap}
.myid{font-size:26px;font-weight:700;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:8px}
.search{display:flex;gap:8px}
.search input{flex:1}
.frow{width:100%;border:0;background:none;text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 14px}
.fwrap{border-top:1px solid var(--line)}
.fwrap:first-child{border-top:0}
.fdetail{padding:0 14px 14px}
.chev{color:var(--ink-3);font-size:14px;transition:transform .15s}
.chev.open{transform:rotate(90deg)}
.fgrid{display:grid;grid-template-columns:24px repeat(5,minmax(0,1fr));gap:3px;margin-top:4px}
.fgrid .hd{font-size:11px;text-align:center;color:var(--ink-3)}
.fgrid .hd.now{color:var(--class);font-weight:700}
.fgrid .pd{font-size:11px;color:var(--ink-3);display:grid;place-items:center}
.fcell{height:28px;border-radius:6px;background:var(--priv-tint);color:var(--priv);font-size:10.5px;display:grid;place-items:center}
.fcell.both{background:var(--priv);color:#fff;font-weight:700}
.fcell.busy{background:var(--surface-2);color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--line)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin:10px 4px 0;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dayhead{display:flex;align-items:center;gap:8px;margin:22px 0 14px;padding-top:18px;border-top:1px solid var(--line)}
.dayhead .d{flex:1}
.dayhead .d strong{font-size:20px;display:block;line-height:1.3}
.hol-name{font-size:12px;color:var(--task)}
.tt{display:grid;grid-template-columns:30px repeat(5,minmax(0,1fr));gap:4px}
.tt .hd{font-size:12px;text-align:center;color:var(--ink-3);padding-bottom:2px}
.tt .pd{font-size:11px;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.tt .pd b{font-size:13px;color:var(--ink-2)}
.cell{min-height:72px;border:1px dashed var(--line);border-radius:10px;background:transparent;padding:6px 5px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cell.has{border:0;background:var(--class-tint);border-left:3px solid var(--class)}
.cell.warn{border-left-color:var(--task)}
.cell .cn{font-weight:700;font-size:11.5px;line-height:1.3;color:var(--ink);word-break:break-all}
.cell .cr{color:var(--ink-2);font-size:10.5px;line-height:1.3;word-break:break-all}
.ar{padding:12px 14px;border-top:1px solid var(--line)}
.ar:first-child{border-top:0}
.ar-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pct{font-weight:700;font-variant-numeric:tabular-nums}
.pct.warn{color:var(--task)}
.bar{height:6px;background:var(--surface-2);border-radius:6px;margin:6px 0;position:relative;box-shadow:inset 0 0 0 1px var(--line)}
.bar i{display:block;height:100%;background:var(--class);border-radius:6px}
.bar.warn i{background:var(--task)}
.bar .line{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink-3);border-radius:1px}
.marks{display:flex;gap:3px;align-items:center}
.mk{width:9px;height:9px;border-radius:2px;background:var(--class)}
.mk.a{background:transparent;box-shadow:inset 0 0 0 1.5px var(--task)}
.warn-text{font-size:12px;color:var(--task);font-weight:700;margin-top:4px}
.tcard{padding:14px;border-top:1px solid var(--line)}
.tcard:first-child{border-top:0}
.who{display:flex;gap:10px;align-items:center}
.slots{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.slot{background:var(--surface-2);border-radius:10px;padding:9px 11px}
.slot .dates{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.date-btn{border:1px solid var(--class);color:var(--class);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:12px;cursor:pointer}
.date-btn:disabled{border-color:var(--line);color:var(--ink-3);cursor:not-allowed}
.st{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700;white-space:nowrap}
.st.pending{background:var(--surface-2);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}
.st.approved{background:var(--class-tint);color:var(--class)}
.st.declined,.st.cancelled{background:var(--task-tint);color:var(--task)}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.lock{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-3);margin:8px 2px 0}
.lock svg{width:14px;height:14px;flex:none}
.chat-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.free{font-size:12px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.chat{display:flex;flex-direction:column;gap:8px;padding:14px 0}
.msg{max-width:80%;padding:8px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:14px;line-height:1.55;align-self:flex-start;white-space:pre-wrap;word-break:break-word}
.msg.me{align-self:flex-end;background:var(--class);color:var(--on-class);border-color:var(--class)}
.msg .at{display:block;font-size:10px;opacity:.7;margin-top:2px}
.chat-input{position:sticky;bottom:calc(60px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;background:var(--bg);padding:8px 0}
.chat-input input{flex:1}
.menu-btn{width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:13px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:15px}
.menu-btn:first-child{border-top:0}
.menu-btn:disabled{color:var(--ink-3);cursor:not-allowed}
.menu-btn .soon{margin-left:auto;font-size:11px;color:var(--ink-3)}
.menu-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 14px;border-top:1px solid var(--line)}
.profile{display:flex;gap:14px;align-items:center;padding:16px 14px}
.overlay{position:fixed;inset:0;background:rgba(10,14,24,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:460px;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 14px;font-size:17px}
.sheet .actions{display:flex;gap:8px;align-items:center;margin-top:6px}
.sheet .info{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.err{color:var(--task);font-size:13px;margin:8px 0 0;min-height:1em}
#toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;white-space:nowrap}
#toast.show{opacity:1}
.login{max-width:460px;margin:0 auto;padding:56px 24px 40px}
.login .mark{width:44px;height:44px;border-radius:12px;font-size:22px;margin-bottom:18px}
.login h1{font-size:32px;margin:0;line-height:1.2}
.login .copy{font-size:15px;margin:8px 0 32px}
.who-btn{width:100%;display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;margin-bottom:8px}
.who-btn:hover{border-color:var(--class)}
.who-btn .avatar{pointer-events:none}
.auth{padding:18px 16px 6px}
.auth h2{font-size:17px;margin-bottom:14px}
.btn.wide{width:100%;padding:11px 14px;font-size:15px}
.link{border:0;background:none;color:var(--class);font-weight:700;cursor:pointer;padding:2px 0;text-decoration:underline;text-underline-offset:3px}
.center{text-align:center;font-size:14px;color:var(--ink-2);margin:18px 0 0}
.demo{margin-top:22px;background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--ink-2);line-height:1.7}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const WD=['日','月','火','水','木','金','土'];
const PERIODS={1:['09:00','10:30'],2:['10:40','12:10'],3:['13:00','14:30'],4:['14:40','16:10'],5:['16:20','17:50']};
const HOL={'2026-09-21':'敬老の日','2026-09-22':'国民の休日','2026-09-23':'秋分の日','2026-10-12':'スポーツの日','2026-11-03':'文化の日','2026-11-23':'勤労感謝の日','2027-01-01':'元日','2027-01-11':'成人の日','2027-02-11':'建国記念の日'};
const MOODS=[['(^o^)','元気'],['(・_・)','ふつう'],['(-_-)','つかれた'],['(>_<)','しんどい']];
const THRESH=70;
const KEY='unical-proto-v4';
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const TS=ymd(TODAY);
const rel=n=>ymd(addDays(TODAY,n));
const md=s=>{const d=parse(s);return (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')';};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let seq=Date.now()%1000000;
const nid=p=>p+(++seq).toString(36);
const daysUntil=s=>Math.round((parse(s)-TODAY)/864e5);
function nextDates(w,n){const r=[];let d=new Date(TODAY);for(let i=0;i<60&&r.length<n;i++){if(d.getDay()===w)r.push(ymd(d));d=addDays(d,1);}return r;}
function prevDates(w,n){const r=[];let d=addDays(TODAY,-1);for(let i=0;i<120&&r.length<n;i++){if(d.getDay()===w&&!HOL[ymd(d)])r.push(ymd(d));d=addDays(d,-1);}return r;}

function eventItem(e){

}
function assignItem(a,withDue){
  return '<div class="item"><span class="rail task"></span><button class="check'+(a.done?' done':'')+'" data-act="as-toggle" data-id="'+a.id+'" aria-pressed="'+a.done+'" aria-label="'+esc(a.title)+'を完了にする">'+(a.done?ic.check:'')+'</button><div class="main"><div class="title'+(a.done?' done-text':'')+'">'+esc(a.title)+'</div><div class="sub">'+esc(a.course)+(withDue?'':'　締切 '+md(a.due))+'</div></div>'+(withDue&&!a.done?'<span class="due">'+dueLabel(a.due)+'</span>':'')+'</div>';
}
function scheduleList(ds){
  const rows=[];
  classesOn(ds).forEach(c=>rows.push([PERIODS[c.period][0],classItem(c,ds)]));
  meetingsOn(ds).forEach(b=>rows.push([b.start,meetItem(b)]));
  eventsOn(ds).forEach(e=>rows.push([e.time,eventItem(e)]));
  rows.sort((a,b)=>a[0].localeCompare(b[0]));
  return rows.length?rows.map(r=>r[1]).join(''):'<div class="empty">予定はありません。</div>';
}

  D.session=u.id;U.tab='today';U.selDate=null;U.chat=null;save();render();window.scrollTo(0,0);toast(u.name+(u.role==='teacher'?'先生':'さん')+'、おかえりなさい');

function doSignup(){
  const name=val('s-name'),univ=val('s-univ'),dept=val('s-dept'),id=norm(val('s-id')),pw=norm(document.getElementById('s-pw').value),pw2=norm(document.getElementById('s-pw2').value);
  if(!name)return authErr('名前を入力してください。');
  if(!id)return authErr('ログインIDを入力してください。');
  if(Object.values(D.users).some(x=>x.loginId===id))return authErr('このログインIDはすでに使われています。');
  if(!pw)return authErr('パスワードを入力してください。');
  if(pw!==pw2)return authErr('確認用のパスワードが一致しません。');
  if(U.signRole==='teacher'){
    if(norm(val('s-code')).toUpperCase()!==TEACHER_CODE)return authErr('先生用の登録コードが正しくありません。大学から配られたコードを入力してください。');
    const zemiName=val('s-zhas')==='yes'?(val('s-zname')||name+'ゼミ'):null;
    const t={id:nid('t'),role:'teacher',name,univ,dept,loginId:id,password:pw,zemiName};
    D.users[t.id]=t;D.tt[t.id]=[];D.todos[t.id]=[];
    D.session=t.id;U.auth='login';U.signRole='student';U.tab='today';U.selDate=null;U.chat=null;save();render();window.scrollTo(0,0);toast('登録しました。ようこそ、'+name+'先生');

  D.users[u.id]=u;D.tt[u.id]=[];D.todos[u.id]=[];
  D.session=u.id;U.auth='login';U.tab='today';U.selDate=null;U.chat=null;save();render();window.scrollTo(0,0);toast('登録しました。ようこそ、'+name+'さん');
}

const MOOD_BAD=3,ALERT_DAYS=7;
const zemiStudents=tid=>Object.values(D.users).filter(u=>u.role==='student'&&u.zemi===tid);
function shStreak(uid){let d=new Date(TODAY);if(D.moods[uid+'|'+ymd(d)]==null)d=addDays(d,-1);let n=0;while(D.moods[uid+'|'+ymd(d)]===MOOD_BAD&&n<90){n++;d=addDays(d,-1);}return n;}
function zemiAlerts(){D.moodAck=D.moodAck||{};return zemiStudents(D.session).filter(s=>shStreak(s.id)>=ALERT_DAYS&&D.moodAck[D.session+'|'+s.id]!==TS);}
function moodShareNote(){
  if(isT())return '';

  return '<p class="note">'+(z?'選んだ気分は、ゼミの'+esc(z.name)+'先生だけに共有されます。友達には表示されません。':'プロフィールでゼミの先生を設定すると、気分を先生と共有できます。')+'</p>';
}
function renderZemiAlerts(){

function renderCalendar(){
  const y=U.calY,m=U.calM,first=new Date(y,m,1),dim=new Date(y,m+1,0).getDate();
  const weeks=Math.ceil((first.getDay()+dim)/7);const start=addDays(first,-first.getDay());
  const f=U.calFilter;
  let h='<div class="cal-head"><button class="arrow" data-act="cal-prev" aria-label="前の月">‹</button><div class="ym">'+y+'年'+(m+1)+'月</div><button class="btn small" data-act="cal-today">今日</button><button class="arrow" data-act="cal-next" aria-label="次の月">›</button></div>';
  h+='<div style="margin-bottom:12px"><div class="seg" role="group" aria-label="表示する予定">'+[['all','すべて'],['uni','大学'],['priv','プライベート']].map(x=>'<button data-act="cal-filter" data-f="'+x[0]+'" aria-pressed="'+(f===x[0])+'">'+x[1]+'</button>').join('')+'</div></div>';
  h+='<div class="panel cal"><div class="grid7">'+WD.map((w,i)=>'<div class="dow'+(i===0?' sun':i===6?' sat':'')+'">'+w+'</div>').join('');
  for(let i=0;i<weeks*7;i++){
    const d=addDays(start,i),ds=ymd(d),w=d.getDay();
    const dots=[];
    if(f!=='priv'){if(classesOn(ds).length&&!HOL[ds])dots.push('class');if(meetingsOn(ds).length)dots.push('meet');if(assignOn(ds).some(a=>!a.done))dots.push('task');}
    if(f!=='uni'){if(eventsOn(ds).length)dots.push('priv');}
    const cls=['day',d.getMonth()!==m?'out':'',w===0?'sun':'',w===6?'sat':'',HOL[ds]?'hol':'',ds===TS?'today':'',ds===U.calSel?'sel':''].join(' ');
    h+='<button class="'+cls+'" data-act="day" data-d="'+ds+'" aria-pressed="'+(ds===U.calSel)+'" aria-label="'+md(ds)+(HOL[ds]?' '+HOL[ds]:'')+'"'+(HOL[ds]?' title="'+HOL[ds]+'"':'')+'><span class="n">'+d.getDate()+'</span><span class="dots">'+dots.map(c=>'<span class="dot '+c+'"></span>').join('')+'</span></button>';
  }
  h+='</div></div><div class="legend"><span><i class="dot class"></i>授業</span><span><i class="dot meet"></i>面談</span><span><i class="dot task"></i>課題の締切</span><span><i class="dot priv"></i>プライベート</span></div>';
  h+=renderDay(U.calSel);
  return h;
}

  if(m.type==='event'){const t=val('m-a'),d=val('m-b'),tm=val('m-c');if(!t)return err('タイトルを入力してください。');if(!d)return err('日付を選んでください。');D.events.push({id:nid('e'),owner:D.session,date:d,time:tm||'00:00',title:t});toast('予定を追加しました');}
  else if(m.type==='assign'){const t=val('m-a'),c=val('m-b'),d=val('m-c');if(!t)return err('課題名を入力してください。');if(!d)return err('締切を選んでください。');D.assignments.push({id:nid('a'),course:c,title:t,due:d,done:false});toast('課題を追加しました');}
  else if(m.type==='course'){const n=val('m-a');if(!n)return err('科目名を入力してください。');let c=myTT().find(x=>x.day===m.day&&x.period===m.period);if(!c){c={id:nid('c'),day:m.day,period:m.period};myTT().push(c);}c.name=n;c.room=val('m-b');if(!isT())c.teacher=val('m-c');toast('時間割を保存しました');}
  else if(m.type==='slot'){const day=Number(val('m-a')),st=val('m-b'),en=val('m-c'),pl=val('m-d');if(!st||!en)return err('開始と終了の時刻を入力してください。');if(st>=en)return err('終了は開始より後の時刻にしてください。');if(!pl)return err('場所を入力してください。');let s=D.slots.find(x=>x.id===m.id);if(s&&s.teacherId!==D.session)return err('この空き時間は編集できません。');if(!s){s={id:nid('sl'),teacherId:D.session};D.slots.push(s);}Object.assign(s,{day,start:st,end:en,place:pl});toast('空き時間を保存しました');}
  else if(m.type==='book'){const s=D.slots.find(x=>x.id===m.slotId);if(taken(s.id,m.date))return err('この日時はすでに予約されています。');const note=val('m-a');const b={id:nid('b'),teacherId:s.teacherId,studentId:D.session,slotId:s.id,date:m.date,start:s.start,end:s.end,place:s.place,note,status:'pending',changed:false};D.bookings.push(b);pushMsg(s.teacherId,D.session,D.session,'面談を申し込みました：'+bText(b)+(note?'\n'+note:''));toast('予約を申し込みました');}
  else if(m.type==='resched'){const v=val('m-a');if(!v)return closeModal();const p=v.split('|'),s=D.slots.find(x=>x.id===p[0]),b=D.bookings.find(x=>x.id===m.id);Object.assign(b,{slotId:s.id,date:p[1],start:s.start,end:s.end,place:s.place,status:'approved',changed:true});pushMsg(b.teacherId,b.studentId,D.session,'日時を変更して確定しました：'+bText(b)+'（'+b.place+'）');toast('日時を変更して確定しました');}
  else if(m.type==='profile'){const n=val('m-a');if(!n)return err('名前を入力してください。');Object.assign(me(),{name:n,univ:val('m-b'),dept:val('m-c')});if(!isT())me().zemi=val('m-z')||null;else me().zemiName=val('m-zn')||null;toast('プロフィールを保存しました');}
  else if(m.type==='reset'){const th=D.theme,sess=D.session;D=seed();D.theme=th;if(D.users[sess])D.session=sess;U.tab='today';U.selDate=null;U.chat=null;toast('サンプルデータに戻しました');}
  U.modal=null;save();render();
}
function modalDel(){
  const m=U.modal;
  if(m.type==='course'){D.tt[D.session]=myTT().filter(x=>!(x.day===m.day&&x.period===m.period));toast('授業を削除しました');}
  else if(m.type==='slot'){const s=D.slots.find(x=>x.id===m.id);if(s&&s.teacherId===D.session){D.slots=D.slots.filter(x=>x.id!==m.id);toast('空き時間を削除しました');}}
  U.modal=null;save();render();
}

/* ---------- actions ---------- */
function addTodo(){const el=document.getElementById('todo-input');const t=el&&el.value.trim();if(!t)return;(D.todos[D.session]=D.todos[D.session]||[]).push({id:nid('d'),text:t,done:false});save();render();const n=document.getElementById('todo-input');if(n)n.focus();}
function sendChat(){const el=document.getElementById('chat-input');const t=el&&el.value.trim();if(!t)return;const other=U.chat;if(String(other).startsWith('zemi:')){(D.threads[other]=D.threads[other]||[]).push({from:D.session,text:t,at:stamp()});}else if(isT())pushMsg(D.session,other,D.session,t);else pushMsg(other,D.session,D.session,t);save();render();const n=document.getElementById('chat-input');if(n)n.focus();}

document.addEventListener('click',e=>{
  if(e.target.classList&&e.target.classList.contains('overlay')){closeModal();return;}
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const a=el.dataset.act,ds=el.dataset;
  const find=(arr,id)=>arr.find(x=>x.id===id);
  switch(a){
    case 'friends':U.menuView='friends';render();window.scrollTo(0,0);break;
    case 'friends-back':U.menuView=null;render();window.scrollTo(0,0);break;
    case 'f-search':{U.fq=document.getElementById('f-q').value.trim();render();break;}
    case 'f-req':{if(!friendRel(ds.u)){D.friends.push({id:nid('f'),from:D.session,to:ds.u,status:'pending'});save();}render();toast('友達申請を送りました');break;}
    case 'f-accept':{const f=find(D.friends,ds.id);if(f&&f.to===D.session){f.status='accepted';save();toast(sName(f.from)+'と友達になりました');}render();break;}
    case 'f-decline':D.friends=D.friends.filter(x=>!(x.id===ds.id&&x.to===D.session));save();render();toast('申請を断りました');break;
    case 'f-cancel':D.friends=D.friends.filter(x=>!(x.id===ds.id&&x.from===D.session));save();render();toast('申請を取り消しました');break;
    case 'f-remove':D.friends=D.friends.filter(x=>!(x.id===ds.id&&(x.from===D.session||x.to===D.session)));U.fopen=null;save();render();toast('友達から外しました');break;
    case 'f-open':U.fopen=U.fopen===ds.u?null:ds.u;render();break;
    case 'f-copy':{const id=me().publicId;try{navigator.clipboard.writeText(id).then(()=>toast('IDをコピーしました'),()=>toast('コピーできませんでした。'+id+' を手で伝えてください'));}catch(e){toast('コピーできませんでした。'+id+' を手で伝えてください');}break;}
    case 'mood-ack':D.moodAck=D.moodAck||{};D.moodAck[D.session+'|'+ds.u]=TS;save();render();toast('確認済みにしました');break;
    case 'do-login':doLogin();break;
    case 'sign-role':U.signRole=ds.v;render();break;
    case 'do-signup':doSignup();break;
    case 'to-signup':U.auth='signup';render();window.scrollTo(0,0);break;
    case 'to-login':U.auth='login';render();window.scrollTo(0,0);break;
    case 'logout':D.session=null;U.auth='login';U.modal=null;U.menuView=null;U.fq='';U.fopen=null;save();render();window.scrollTo(0,0);toast('ログアウトしました');break;
    case 'tab':U.tab=ds.t;U.chat=null;U.menuView=null;if(ds.t!=='cal')U.selDate=null;render();window.scrollTo(0,0);break;
    case 'mood':{const k=D.session+'|'+TS,i=Number(ds.i);D.moods[k]=D.moods[k]===i?undefined:i;save();render();break;}
    case 'todo-toggle':{const t=find(D.todos[D.session],ds.id);t.done=!t.done;save();render();break;}
    case 'todo-del':D.todos[D.session]=D.todos[D.session].filter(x=>x.id!==ds.id);save();render();break;
    case 'todo-add':addTodo();break;
    case 'as-toggle':{const t=find(D.assignments,ds.id);t.done=!t.done;save();render();if(t.done)toast('課題を完了にしました');break;}
    case 'att':{const r=D.attendance[ds.c]=D.attendance[ds.c]||{};if(r[ds.d]===ds.v)delete r[ds.d];else r[ds.d]=ds.v;save();render();break;}
    case 'cal-prev':if(--U.calM<0){U.calM=11;U.calY--;}render();break;
    case 'cal-next':if(++U.calM>11){U.calM=0;U.calY++;}render();break;
    case 'cal-today':U.calY=TODAY.getFullYear();U.calM=TODAY.getMonth();U.calSel=TS;render();break;
    case 'cal-filter':U.calFilter=ds.f;render();break;
    case 'day':{U.calSel=ds.d;const p=parse(ds.d);if(p.getMonth()!==U.calM){U.calY=p.getFullYear();U.calM=p.getMonth();}render();const b=document.querySelector('[data-act=day][data-d="'+ds.d+'"]');if(b)b.focus({preventScroll:true});break;}
    case 'day-back':{const d=parse(U.selDate);U.calY=d.getFullYear();U.calM=d.getMonth();U.selDate=null;render();break;}
    case 'day-shift':U.selDate=ymd(addDays(parse(U.selDate),Number(ds.n)));render();break;
    case 'ev-add':U.modal={type:'event',date:ds.d};renderModal();break;
    case 'as-add':U.modal={type:'assign',date:ds.d};renderModal();break;
    case 'ev-del':D.events=D.events.filter(x=>!(x.id===ds.id&&x.owner===D.session));save();render();toast('予定を削除しました');break;
    case 'tt-cell':U.modal={type:'course',day:Number(ds.day),period:Number(ds.p)};renderModal();break;
    case 'book':U.modal={type:'book',slotId:ds.s,date:ds.d};renderModal();break;
    case 'bk-cancel':{const b=find(D.bookings,ds.id);if(b.studentId!==D.session)break;b.status='cancelled';pushMsg(b.teacherId,b.studentId,D.session,'面談の予約を取り消しました：'+bText(b));save();render();toast('予約を取り消しました');break;}
    case 'bk-approve':{const b=find(D.bookings,ds.id);if(b.teacherId!==D.session)break;b.status='approved';pushMsg(b.teacherId,b.studentId,D.session,'面談を承認しました：'+bText(b)+'（'+b.place+'）');save();render();toast('面談を承認しました');break;}
    case 'bk-decline':{const b=find(D.bookings,ds.id);if(b.teacherId!==D.session)break;b.status='declined';pushMsg(b.teacherId,b.studentId,D.session,'今回の面談はお受けできません：'+bText(b)+'\nほかの空き時間で申し込んでください。');save();render();toast('申し込みを断りました');break;}
    case 'bk-resched':U.modal={type:'resched',id:ds.id};renderModal();break;
    case 'slot-add':U.modal={type:'slot',id:null};renderModal();break;
    case 'slot-edit':U.modal={type:'slot',id:ds.id};renderModal();break;
    case 'chat-open':U.chat=ds.u;U.tab='teacher';render();break;
    case 'chat-back':U.chat=null;render();window.scrollTo(0,0);break;
    case 'chat-send':sendChat();break;
    case 'profile':U.modal={type:'profile'};renderModal();break;
    case 'theme':D.theme=ds.v;save();render();break;
    case 'reset':U.modal={type:'reset'};renderModal();break;
    case 'modal-close':closeModal();break;
    case 'modal-save':modalSave();break;
    case 'modal-del':modalDel();break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&U.modal){closeModal();return;}
  if(e.key==='Enter'&&!e.isComposing){
    if(e.target.id==='l-id'||e.target.id==='l-pw'){e.preventDefault();doLogin();}
    else if(e.target.id==='f-q'){e.preventDefault();U.fq=e.target.value.trim();render();const n=document.getElementById('f-q');if(n)n.focus();}
    else if(/^s-/.test(e.target.id)){e.preventDefault();doSignup();}
    else if(e.target.id==='todo-input'){e.preventDefault();addTodo();}
    else if(e.target.id==='chat-input'){e.preventDefault();sendChat();}
  }
});
render();
</script>
</body>
</html>
